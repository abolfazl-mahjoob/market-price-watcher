name: quality-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: price-watcher-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: watcher
          POSTGRES_USER: watcher
          POSTGRES_PASSWORD: watcher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U watcher -d watcher"
          --health-interval 3s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://watcher:watcher_test@localhost:5432/watcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run migrate
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
